[project]
name = "Call-me-Maybe"
version = "0.1.0"
description = "Constrained function calling pipeline"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=2.2.6",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
exclude = ["llm_sdk/"]

[[tool.mypy.overrides]]
# The provided SDK is not ours to change: use its types, skip its errors.
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "llm_sdk"]
